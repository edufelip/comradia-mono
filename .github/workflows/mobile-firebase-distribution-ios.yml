name: iOS Firebase Distribution

# Builds the dev variant (com.edufelip.comradia.dev, Firebase project comradia-dev) as an Ad Hoc IPA
# and sends it to the App Distribution group base-group. Only devices in the Ad Hoc profile can
# install it. Gated by the repo variable IOS_CI_ENABLED; secrets are only read on push and manual
# runs, never on pull requests (docs/testing.md, "CI").
on:
  workflow_dispatch: {}
  push:
    branches: [develop]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-firebase-distribution-ios.yml'

permissions:
  contents: read

concurrency:
  group: ios-firebase-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

env:
  APP_VARIANT: dev
  BUNDLE_ID: com.edufelip.comradia.dev
  # The name expo prebuild gives the dev variant's project, scheme and target ("Comradia (Dev)").
  IOS_PROJECT: ComradiaDev
  FIREBASE_PROJECT: comradia-dev
  FIREBASE_APP_ID: '1:949794653695:ios:4defe3a9106a9f129c13ca'

jobs:
  firebase-distribution:
    if: vars.IOS_CI_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          xcode_app=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          [ -n "$xcode_app" ] || { echo "::error::Xcode 26 is not installed on this runner." >&2; exit 1; }
          echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode_app/Contents/Developer" xcodebuild -version

      - name: Write dev configuration and credentials
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.FIREBASE_DEV_GOOGLE_SERVICE_INFO_PLIST }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          CERT_P12_BASE64: ${{ secrets.IOS_ADHOC_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_ADHOC_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in ENV_FILE GOOGLE_SERVICE_INFO_PLIST FIREBASE_SERVICE_ACCOUNT_JSON IOS_TEAM_ID CERT_P12_BASE64 CERT_PASSWORD PROFILE_BASE64; do
            [ -n "${!name}" ] || { echo "::error::Secret for $name is not set." >&2; exit 1; }
          done
          umask 077
          printf '%s\n' "$ENV_FILE" > .env
          mkdir -p firebase/dev
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > firebase/dev/GoogleService-Info.plist
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/adhoc.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/adhoc.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/adhoc.mobileprovision" > "$RUNNER_TEMP/adhoc-profile.plist"
          echo "IOS_TEAM_ID=$IOS_TEAM_ID" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os, plistlib
          tmp = os.environ['RUNNER_TEMP']
          env = {}
          for line in open('.env', encoding='utf-8'):
              line = line.strip()
              if line and not line.startswith('#') and '=' in line:
                  key, value = line.removeprefix('export ').split('=', 1)
                  env[key.strip()] = value.strip().strip('"').strip("'")
          assert not env.get('EXPO_PUBLIC_FIREBASE_EMULATOR_HOST'), 'ENV_FILE points at the emulators'
          assert env.get('EXPO_PUBLIC_FIREBASE_PROJECT_ID') == 'comradia-dev', 'ENV_FILE is not for comradia-dev'
          assert env.get('EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID'), 'ENV_FILE lacks EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID'
          info = plistlib.load(open('firebase/dev/GoogleService-Info.plist', 'rb'))
          assert info['PROJECT_ID'] == 'comradia-dev' and info['BUNDLE_ID'] == os.environ['BUNDLE_ID'], 'GoogleService-Info.plist is not the comradia-dev iOS app'
          account = json.load(open(os.path.join(tmp, 'firebase-service-account.json'), encoding='utf-8'))
          assert account.get('type') == 'service_account' and account.get('client_email'), 'invalid service account'
          profile = plistlib.load(open(os.path.join(tmp, 'adhoc-profile.plist'), 'rb'))
          team, ent = os.environ['IOS_TEAM_ID'], profile['Entitlements']
          assert profile['TeamIdentifier'][0] == team, 'profile team does not match IOS_TEAM_ID'
          assert ent['application-identifier'] == f"{team}.{os.environ['BUNDLE_ID']}", 'profile is not for the dev bundle id'
          assert profile.get('ProvisionedDevices'), 'profile is not an Ad Hoc profile with registered devices'
          assert ent.get('get-task-allow') is False, 'profile is a development profile, not Ad Hoc'
          assert ent.get('aps-environment') == 'production', 'profile lacks Push Notifications'
          assert 'Default' in ent.get('com.apple.developer.applesignin', []), 'profile lacks Sign in with Apple'
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f"IOS_PROFILE_NAME={profile['Name']}\nIOS_PROFILE_UUID={profile['UUID']}\n")
          print(f"Profile '{profile['Name']}' covers {len(profile['ProvisionedDevices'])} device(s).")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: apps/mobile/yarn.lock

      - run: yarn install --frozen-lockfile

      - name: Generate the native project
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios --clean
          plist="ios/$IOS_PROJECT/Info.plist"
          entitlements="ios/$IOS_PROJECT/$IOS_PROJECT.entitlements"
          test -f "$plist" && test -f "$entitlements"
          # One build number per run, so testers see each build as new.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$plist"
          # The dev variant asks for the development APNs and App Attest environments, which only a
          # development profile grants. An Ad Hoc build uses production for both.
          /usr/libexec/PlistBuddy -c 'Set :aps-environment production' "$entitlements"
          /usr/libexec/PlistBuddy -c 'Set :com.apple.developer.devicecheck.appattest-environment production' "$entitlements"
          # Pin the profile on the app target only: passed on the xcodebuild command line it would
          # also reach the CocoaPods targets, which reject provisioning profiles.
          python3 - "ios/$IOS_PROJECT.xcodeproj/project.pbxproj" <<'PY'
          import os, re, sys
          path, profile = sys.argv[1], os.environ['IOS_PROFILE_NAME']
          assert profile and '"' not in profile and '\n' not in profile, 'unsafe profile name'
          source = open(path, encoding='utf-8').read()
          pattern = re.compile(r'^(\t+)(CODE_SIGN_ENTITLEMENTS = [^;]+;)$', re.M)
          patched, count = pattern.subn(lambda m: f'{m.group(1)}{m.group(2)}\n{m.group(1)}PROVISIONING_PROFILE_SPECIFIER = "{profile}";', source)
          assert count >= 1, 'no app-target CODE_SIGN_ENTITLEMENTS line found'
          open(path, 'w', encoding='utf-8').write(patched)
          print(f'Pinned the profile on {count} app build configuration(s).')
          PY

      - name: Set up Ad Hoc signing
        env:
          CERT_PASSWORD: ${{ secrets.IOS_ADHOC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/adhoc-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          echo "IOS_KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/adhoc.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          # Keep the system keychains so Xcode can build the Apple WWDR chain.
          security list-keychain -d user -s "$keychain" /Library/Keychains/System.keychain /System/Library/Keychains/SystemRootCertificates.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/adhoc.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"

      - name: Archive
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace "$IOS_PROJECT.xcworkspace" \
            -scheme "$IOS_PROJECT" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$IOS_PROJECT.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $IOS_KEYCHAIN_PATH" | tail -n 200

      - name: Export the Ad Hoc IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>release-testing</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>stripSwiftSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${IOS_PROFILE_NAME}</string></dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$IOS_PROJECT.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ipa=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          [ -n "$ipa" ] || { echo "::error::No IPA was exported." >&2; exit 1; }
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"

      - name: Upload to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -euo pipefail
          git log -1 --pretty='%h %s%n%n%b' > "$RUNNER_TEMP/release-notes.txt"
          # Keep the signed download link out of the public log.
          npx --yes firebase-tools@15.36.0 appdistribution:distribute "$IPA_PATH" \
            --app "$FIREBASE_APP_ID" \
            --project "$FIREBASE_PROJECT" \
            --groups base-group \
            --release-notes-file "$RUNNER_TEMP/release-notes.txt" 2>&1 | sed -E 's#https?://[^ ]+#[link omitted]#g'

      - name: Remove credentials
        if: always()
        run: |
          [ -z "${IOS_KEYCHAIN_PATH:-}" ] || security delete-keychain "$IOS_KEYCHAIN_PATH" > /dev/null 2>&1 || true
          rm -f .env firebase/dev/GoogleService-Info.plist \
            "$RUNNER_TEMP/firebase-service-account.json" "$RUNNER_TEMP/adhoc.p12" \
            "$RUNNER_TEMP/adhoc.mobileprovision" "$RUNNER_TEMP/adhoc-profile.plist" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/${IOS_PROFILE_UUID:-none}.mobileprovision"
