appId: com.edufelip.comradia.dev
name: Onboarding S2–S4
tags:
  - smoke
---
# Journey 2 — a new account fills S2, S3 and S4 and lands on the deck.
#
# The dev build talks to the emulators (EXPO_PUBLIC_FIREBASE_EMULATOR_HOST), which accept
# any number and send a random code that `scripts/sms-code.js` reads back.
- runFlow: subflows/launch.yaml
# Sign up, unless an earlier flow (sign-in.yaml) already left a session on onboarding.
- runFlow:
    when:
      visible:
        id: welcome-cta-start
    commands:
      - tapOn:
          id: welcome-cta-start
      - tapOn:
          id: register-phone-input
      - inputText: '11987654321'
      - tapOn:
          id: register-send-code
      - assertVisible: '.*Enter the code.*'
      # The emulators send a random code; read it back from the auth emulator.
      - runScript:
          file: scripts/sms-code.js
          env:
            PHONE_NUMBER: '+5511987654321'
      # The code field auto-focuses; `opacity: 0` keeps it out of the iOS accessibility
      # tree, so the flow types into the focused field. The sixth digit submits the code.
      - inputText: ${output.code}

# S2 — step 1 of 3, no back button on the first signed-in screen.
- assertVisible:
    id: onboarding-progress
- assertVisible: 'Step 1 of 3'
- tapOn:
    id: onboarding-name
- inputText: Rosa
- tapOn:
    id: onboarding-birthday
- inputText: '14/03/1994'
# The number pad has no Done key; a short drag closes it (keyboardDismissMode on-drag).
- swipe:
    start: 50%, 55%
    end: 50%, 45%
- tapOn:
    id: vibe-bookworm
- scrollUntilVisible:
    element:
      id: looking-for-everyone
- tapOn:
    id: looking-for-everyone
- scrollUntilVisible:
    element:
      id: union-toggle
- tapOn:
    id: union-toggle
- scrollUntilVisible:
    element:
      id: union-apeoesp
- tapOn:
    id: union-apeoesp
- scrollUntilVisible:
    element:
      id: onboarding-continue
- tapOn:
    id: onboarding-continue

# S3 — step 2 of 3. Back keeps the S2 answers.
- assertVisible: 'Step 2 of 3'
- tapOn:
    id: onboarding-back
- assertVisible:
    id: vibe-bookworm
- scrollUntilVisible:
    element:
      id: onboarding-continue
- tapOn:
    id: onboarding-continue
- tapOn:
    id: value-bookshops_coffee
- tapOn:
    id: value-tenant_rights
- tapOn:
    id: value-cycling
- assertVisible: '3/5'
- tapOn:
    id: weight-increase
- assertVisible: '70%'
- tapOn:
    id: weight-decrease
- assertVisible: '60%'
- scrollUntilVisible:
    element:
      id: onboarding-continue
- tapOn:
    id: onboarding-continue

# S4 — step 3 of 3. Finishing writes both documents and routing opens Discover.
- assertVisible: 'Step 3 of 3'
# The prompt chips scroll sideways; swipe the row until "green flag" shows.
# shortcut: the row's height (31%) is measured on an iPhone 16-size screen; use a
# testID on the row's ScrollView if the layout changes.
- repeat:
    times: 4
    while:
      notVisible:
        id: prompt-green_flag
    commands:
      - swipe:
          start: 80%, 31%
          end: 20%, 31%
- tapOn:
    id: prompt-green_flag
- tapOn:
    id: starter-answer
- inputText: You know your neighbours by name.
# The multiline answer has no Done key either; a short drag closes it (keyboardDismissMode on-drag).
- swipe:
    start: 50%, 55%
    end: 50%, 45%
- scrollUntilVisible:
    element:
      id: starter-finish
- tapOn:
    id: starter-finish
- assertVisible:
    id: discover-like
