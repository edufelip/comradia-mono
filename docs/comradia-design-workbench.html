<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comradia: Screen Workbench & Product Definition</title>
  <style>
    :root {
      --ground: #fbf6f6;
      --surface: #ffffff;
      --raised: #f7eded;
      --active: #f2dede;
      --active-ink: #7a1c1c;
      --border: #e6dede;
      --rule: #efe8e8;
      --control: #d6c8c8;
      --text: #181211;
      --muted: #524744;
      --faint: #5e5350;
      --accent: #c83232;
      --primary: #181211;
      --primary-ink: #ffffff;
      --positive: #115230;
      --negative: #b3261e;
      --warning: #92400e;
      --pill-positive-bg: #dcfae5;
      --pill-positive-ink: #04250e;
      --pill-negative-bg: #ffedea;
      --pill-negative-ink: #7a1c1c;
      --pill-warning-bg: #fffbeb;
      --pill-warning-ink: #92400e;
      --pill-neutral-bg: #efe8e8;
      --pill-neutral-ink: #3d3534;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      --fs-title: 24px;
      --fs-section: 16px;
      --fs-body: 14px;
      --fs-data: 13px;
      --fs-small: 12px;
      --sidebar-width: 228px;
      --pad: 24px;
      --gap: 16px;
      --card-pad: 16px;
      --radius-card: 8px;
      --radius-control: 6px;
      --control-height: 32px;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    :root[data-theme="dark"] {
      --ground: #000000;
      --surface: #111111;
      --raised: #1b1616;
      --active: #2a1515;
      --active-ink: #f87171;
      --border: #241e1e;
      --rule: #1a1515;
      --control: #3d3232;
      --text: #ffffff;
      --muted: #b4b4b4;
      --faint: #8e8e8e;
      --accent: #f87171;
      --primary: #ffffff;
      --primary-ink: #000000;
      --positive: #3fc07a;
      --negative: #e5566f;
      --warning: #e5a93b;
      --pill-positive-bg: #172a1d;
      --pill-positive-ink: #3fc07a;
      --pill-negative-bg: #2c1a20;
      --pill-negative-ink: #f87171;
      --pill-warning-bg: #2b2414;
      --pill-warning-ink: #e5a93b;
      --pill-neutral-bg: #221d1d;
      --pill-neutral-ink: #e0d8d8;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      color: var(--text);
      font: var(--fs-body)/20px var(--font);
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
    }

    h1, h2, h3, p, ul, ol, dl, dd {
      margin: 0;
    }

    /* Ruled T-frame shell */
    .shell {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      grid-template-rows: 64px minmax(0, 1fr);
      min-height: 760px;
      background: var(--ground);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      overflow: hidden;
    }

    .topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      padding: 0 20px;
      background: var(--ground);
      border-bottom: 1px solid var(--border);
      gap: 16px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
      flex: 1;
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 208px;
      flex-shrink: 0;
      font-size: var(--fs-section);
      font-weight: 600;
      color: var(--text);
    }

    .wordmark-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--accent);
      flex-shrink: 0;
    }

    .search-input {
      height: var(--control-height);
      width: 100%;
      max-width: 320px;
      padding: 0 12px;
      background: var(--surface);
      border: 1px solid var(--control);
      border-radius: var(--radius-control);
      color: var(--text);
      font: var(--fs-data)/18px var(--font);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 100%;
      padding-left: 16px;
      border-left: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar {
      background: var(--ground);
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
    }

    .nav-group-label {
      font-size: var(--fs-small);
      color: var(--muted);
      padding: 0 10px;
      margin: 12px 0 6px;
      font-weight: 500;
    }

    .nav-group-label:first-child {
      margin-top: 0;
    }

    .nav-list {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-btn {
      width: 100%;
      height: 36px;
      padding: 0 10px;
      border: 0;
      border-radius: var(--radius-control);
      background: transparent;
      color: var(--muted);
      font: var(--fs-data)/18px var(--font);
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      text-align: left;
      transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out);
    }

    .nav-btn:hover {
      background: var(--raised);
      color: var(--text);
    }

    .nav-btn[aria-current="page"] {
      background: var(--active);
      color: var(--active-ink);
      font-weight: 600;
    }

    .nav-count {
      font-size: var(--fs-small);
      color: inherit;
      font-variant-numeric: tabular-nums;
    }

    .sidebar-foot {
      padding: 12px 10px;
      background: var(--raised);
      border-radius: var(--radius-card);
      font-size: var(--fs-small);
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Main canvas */
    .canvas {
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    .title-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .title-row h1 {
      font-size: var(--fs-title);
      line-height: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .title-sub {
      font-size: var(--fs-data);
      color: var(--muted);
      margin-top: 4px;
    }

    /* Controls */
    .btn {
      height: var(--control-height);
      padding: 0 12px;
      border-radius: var(--radius-control);
      border: 1px solid var(--control);
      background: var(--surface);
      color: var(--text);
      font: var(--fs-data)/18px var(--font);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 150ms var(--ease-out), transform 120ms var(--ease-out);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: var(--primary-ink);
      border-color: var(--primary);
    }

    .btn-accent {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .seg {
      display: inline-flex;
      background: var(--raised);
      padding: 2px;
      border-radius: var(--radius-control);
      border: 1px solid var(--border);
      height: var(--control-height);
      align-items: center;
    }

    .seg button {
      border: 0;
      background: transparent;
      color: var(--muted);
      height: 26px;
      padding: 0 10px;
      border-radius: 4px;
      font: var(--fs-small)/16px var(--font);
      font-weight: 500;
      cursor: pointer;
    }

    .seg button[aria-pressed="true"] {
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
    }

    /* Count filter cards (list blueprint from APP SHEET) */
    .count-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .count-card {
      height: 61px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
      cursor: pointer;
      font: inherit;
      color: var(--text);
    }

    .count-card[aria-pressed="true"] {
      border: 1.5px solid var(--accent);
      background: var(--active);
    }

    .count-card-label {
      font-size: var(--fs-data);
      color: var(--muted);
    }

    .count-card[aria-pressed="true"] .count-card-label {
      color: var(--active-ink);
    }

    .count-card-val {
      font-size: var(--fs-section);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* Overview layout: 1fr main column + 360px side rail */
    .work-split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 20px;
      align-items: start;
    }

    .main-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    .rail-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: var(--card-pad);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-title {
      font-size: var(--fs-section);
      font-weight: 600;
    }

    .rail-heading {
      font-size: var(--fs-section);
      font-weight: 600;
      margin-bottom: -8px;
    }

    /* Pills */
    .pill {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: var(--fs-small);
      font-weight: 500;
      white-space: nowrap;
    }

    .pill-crimson {
      background: var(--pill-negative-bg);
      color: var(--pill-negative-ink);
    }

    .pill-green {
      background: var(--pill-positive-bg);
      color: var(--pill-positive-ink);
    }

    .pill-amber {
      background: var(--pill-warning-bg);
      color: var(--pill-warning-ink);
    }

    .pill-neutral {
      background: var(--pill-neutral-bg);
      color: var(--pill-neutral-ink);
    }

    /* Candidate Card & Interactive Hooks */
    .comrade-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .avatar-circle {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: var(--fs-body);
      font-weight: 600;
      flex-shrink: 0;
    }

    .praxis-block {
      background: var(--raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 12px 14px;
      text-align: left;
      width: 100%;
      cursor: pointer;
      font: inherit;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: border-color 150ms var(--ease-out);
    }

    .praxis-block:hover,
    .praxis-block.selected {
      border-color: var(--accent);
      background: var(--active);
    }

    .cause-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .cause-chip {
      height: 28px;
      padding: 0 10px;
      border-radius: var(--radius-control);
      border: 1px solid var(--border);
      background: var(--raised);
      color: var(--text);
      font: var(--fs-data)/18px var(--font);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .cause-chip:hover,
    .cause-chip[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--active);
      color: var(--active-ink);
      font-weight: 500;
    }

    /* Divided KPI strip */
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
    }

    .kpi-cell {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .kpi-cell + .kpi-cell {
      border-left: 1px solid var(--rule);
    }

    .kpi-label {
      font-size: var(--fs-data);
      color: var(--muted);
    }

    .kpi-val {
      font-size: var(--fs-title);
      line-height: 28px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .kpi-sub {
      font-size: var(--fs-small);
      color: var(--faint);
    }

    /* Ruled rows list */
    .ruled-list {
      display: flex;
      flex-direction: column;
    }

    .ruled-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 45px;
      padding: 8px 0;
    }

    .ruled-row + .ruled-row {
      border-top: 1px solid var(--rule);
    }

    .field-input {
      width: 100%;
      height: var(--control-height);
      padding: 0 10px;
      border-radius: var(--radius-control);
      border: 1px solid var(--control);
      background: var(--surface);
      color: var(--text);
      font: var(--fs-data)/18px var(--font);
    }

    .field-textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: var(--radius-control);
      border: 1px solid var(--control);
      background: var(--surface);
      color: var(--text);
      font: var(--fs-data)/18px var(--font);
      resize: vertical;
    }

    /* Table */
    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-table th,
    .data-table td {
      padding: 10px 8px;
      font-size: var(--fs-data);
      text-align: left;
      border-bottom: 1px solid var(--rule);
    }

    .data-table th {
      font-size: var(--fs-small);
      color: var(--muted);
      font-weight: 500;
    }

    .data-table .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* Mobile bottom nav */
    .mobile-nav {
      display: none;
    }

    @media (max-width: 860px) {
      .shell {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: 52px minmax(0, 1fr) auto;
      }

      .sidebar {
        display: none;
      }

      .wordmark {
        width: auto;
      }

      .topbar {
        height: 52px;
        padding: 0 16px;
      }

      .search-input {
        display: none;
      }

      .canvas {
        padding: 16px;
      }

      .count-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .work-split {
        grid-template-columns: minmax(0, 1fr);
      }

      .kpi-strip {
        grid-template-columns: minmax(0, 1fr);
      }

      .kpi-cell + .kpi-cell {
        border-left: 0;
        border-top: 1px solid var(--rule);
      }

      .mobile-nav {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        border-top: 1px solid var(--border);
        background: var(--ground);
        padding: 6px 16px;
        gap: 2px;
      }

      .mobile-nav button {
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 8px 4px;
        border-radius: var(--radius-control);
        font: var(--fs-small)/14px var(--font);
        font-weight: 500;
        cursor: pointer;
      }

      .mobile-nav button[aria-current="page"] {
        background: var(--active);
        color: var(--active-ink);
        font-weight: 600;
      }
    }

    @media (max-width: 640px) {
      #citySelect {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="wordmark">
          <span class="wordmark-dot" aria-hidden="true"></span>
          <span>Comradia</span>
        </div>
        <input
          id="globalSearch"
          class="search-input"
          type="search"
          placeholder="Search comrades, causes, or cities..."
          aria-label="Search comrades, causes, or cities"
        />
      </div>
      <div class="topbar-right">
        <select id="citySelect" class="btn" aria-label="Collective chapter">
          <option value="São Paulo">São Paulo · 18 comrades</option>
          <option value="Florianópolis">Florianópolis · 9 comrades</option>
          <option value="Rio de Janeiro">Rio de Janeiro · 12 comrades</option>
          <option value="All">All Chapters · 39 comrades</option>
        </select>
        <div class="seg" id="langSeg" role="group" aria-label="Language">
          <button type="button" data-lang="en-US" aria-pressed="true">EN</button>
          <button type="button" data-lang="pt-BR" aria-pressed="false">PT</button>
        </div>
        <div class="seg" id="themeSeg" role="group" aria-label="Theme">
          <button type="button" data-theme-mode="light" aria-pressed="true">Light</button>
          <button type="button" data-theme-mode="dark" aria-pressed="false">Dark</button>
        </div>
      </div>
    </header>

    <!-- Left sidebar -->
    <aside class="sidebar" aria-label="App screens">
      <div>
        <div class="nav-group-label" id="navGroupCore">Core app screens</div>
        <ul class="nav-list" id="sidebarNav">
          <li>
            <button type="button" class="nav-btn" data-screen="queue" aria-current="page">
              <span id="navLblQueue">Comrades queue</span>
              <span class="nav-count" id="navCntQueue">6</span>
            </button>
          </li>
          <li>
            <button type="button" class="nav-btn" data-screen="inbox">
              <span id="navLblInbox">Mutual solidarity</span>
              <span class="nav-count" id="navCntInbox">2</span>
            </button>
          </li>
          <li>
            <button type="button" class="nav-btn" data-screen="praxis">
              <span id="navLblPraxis">Praxis & collective</span>
              <span class="nav-count">39</span>
            </button>
          </li>
        </ul>

        <div class="nav-group-label" id="navGroupOnb">Onboarding & setup</div>
        <ul class="nav-list" id="sidebarNavOnb">
          <li>
            <button type="button" class="nav-btn" data-screen="identity">
              <span id="navLblIdentity">Identity & tendency</span>
              <span class="nav-count">1/2</span>
            </button>
          </li>
          <li>
            <button type="button" class="nav-btn" data-screen="causes">
              <span id="navLblCauses">Causes & prompts</span>
              <span class="nav-count" id="navCntCauses">4/5</span>
            </button>
          </li>
        </ul>
      </div>

      <div class="sidebar-foot">
        <div style="font-weight:600;color:var(--text);">Screen definition workbench</div>
        <div id="specStatusText">All 5 screens use the Accent ladder + Ruled T-frame direction.</div>
        <button type="button" class="btn" id="btnCopySpec" style="width:100%;margin-top:4px;">Copy screen spec JSON</button>
      </div>
    </aside>

    <!-- Main screen canvas -->
    <main class="canvas" id="mainCanvas"></main>

    <!-- Mobile bottom navigation -->
    <nav class="mobile-nav" id="mobileNav" aria-label="Mobile screen switcher">
      <button type="button" data-screen="queue" aria-current="page">Comrades</button>
      <button type="button" data-screen="inbox">Solidarity</button>
      <button type="button" data-screen="identity">Identity</button>
      <button type="button" data-screen="causes">Causes</button>
      <button type="button" data-screen="praxis">Praxis</button>
    </nav>
  </div>

  <script>
    (function () {
      const $ = (sel) => document.querySelector(sel);
      const $$ = (sel) => Array.from(document.querySelectorAll(sel));

      const TENDENCIES = [
        'Democratic Socialist',
        'Eco-Socialist',
        'Social Democrat',
        'Anarcho-Syndicalist',
        'Labor / Unionist',
        'Progressive'
      ];

      const ALL_CAUSES = [
        'Labor Rights',
        'Climate Justice',
        'Tenant Union',
        'Universal Healthcare',
        'Queer Liberation',
        'Transit For All',
        'Public Education',
        'Free Software',
        'Mutual Aid',
        'Indigenous Rights'
      ];

      const PROMPT_TEMPLATES = [
        'Ideal low-consumption first date:',
        'My favorite local mutual aid or community project:',
        'The labor or climate hill I will gladly die on:',
        'A book or film that shaped my worldview:'
      ];

      // Believable candidate dataset with distinct avatar hues (60+ deg apart)
      const INITIAL_CANDIDATES = [
        {
          id: 'maya-linhares',
          displayName: 'Maya Linhares',
          initials: 'ML',
          avatarBg: '#fde8e8',
          avatarInk: '#7a1c1c',
          age: 28,
          pronouns: 'she/her',

          unionMember: true,
          unionName: 'SEESP Architects Union',
          NewThisWeek: true,
          causes: ['Climate Justice', 'Transit For All', 'Tenant Union', 'Mutual Aid'],
          bio: 'Urban planner by day, community garden organizer on Saturdays. Looking for someone to bike the Minhocão with and debate degrowth over espresso.',
          praxisPromptTitle: 'Ideal low-consumption first date:',
          praxisPrompt: 'Prepping vegetables at the solidarity kitchen, then live samba at a cooperative bar.'
        },
        {
          id: 'lucas-ferreira',
          displayName: 'Lucas Ferreira',
          initials: 'LF',
          avatarBg: '#e3f5ec',

              c.tendency.toLowerCase().includes(q) ||
              c.city.toLowerCase().includes(q) ||
              c.causes.some((x) => x.toLowerCase().includes(q));

          return true;
        });

                    <input id="inpOnbName" class="field-input" value="${memberProfile.displayName}" />
                  </div>
                  <div>
                    <label style="font-size:var(--fs-small);color:var(--muted);display:block;margin-bottom:4px;">Pronouns</label>
                    <input id="inpOnbPronouns" class="field-input" value="${memberProfile.pronouns}" />
                  </div>
                  <div>
                    <label style="font-size:var(--fs-small);color:var(--muted);display:block;margin-bottom:4px;">City chapter</label>
                    <input id="inpOnbCity" class="field-input" value="${memberProfile.city}" />
                  </div>
                  <div>
                    <label style="font-size:var(--fs-small);color:var(--muted);display:block;margin-bottom:4px;">Neighborhood</label>
                    <input id="inpOnbNeighborhood" class="field-input" value="${memberProfile.neighborhood}" />
                  </div>
                </div>

                <div style="padding-top:8px;">
                  <div style="font-size:var(--fs-small);color:var(--muted);margin-bottom:6px;">Primary political tendency (Choose one):</div>
                  <div class="cause-row" id="onbTendencyRow">
                    ${TENDENCIES.map(
                      (t) =>
                        `<button type="button" class="cause-chip" data-pick-tendency="${t}" aria-pressed="${
                          memberProfile.tendency === t
                        }">${t}</button>`
                    ).join('')}
                  </div>
                </div>

                <div style="padding-top:8px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:8px;">
                  <label style="display:flex;align-items:center;gap:8px;font-size:var(--fs-data);font-weight:500;cursor:pointer;">
                    <input type="checkbox" id="chkOnbUnion" ${memberProfile.unionMember ? 'checked' : ''} />
                    I am an active labor union or syndicate member
                  </label>
                  ${
                    memberProfile.unionMember
                      ? `<div>
                          <label style="font-size:var(--fs-small);color:var(--muted);display:block;margin-bottom:4px;">Union local or syndicate name</label>
                          <input id="inpOnbUnionName" class="field-input" value="${memberProfile.unionName}" />
                        </div>`
                      : ''
                  }
                </div>
              </section>
            </div>

            <div class="rail-col">
              <h2 class="rail-heading">Live card header preview</h2>
              <section class="panel">
                <div class="comrade-header">
                  <div>
                    <div class="panel-title">${memberProfile.displayName}, ${memberProfile.age}</div>
                    <div style="font-size:var(--fs-small);color:var(--muted);">${memberProfile.pronouns} · ${memberProfile.city} (${memberProfile.neighborhood})</div>
                  </div>
                </div>
                <div class="cause-row">
                  <span class="pill pill-crimson">${memberProfile.tendency}</span>
                  ${
                    memberProfile.unionMember
                      ? `<span class="pill pill-neutral">${memberProfile.unionName || 'Union Member'}</span>`
                      : ''
                  }
                </div>
              </section>
            </div>
          </div>
        `;
      }

      function renderCausesScreen() {
        return `
          <div class="title-row">
            <div>
              <h1>Onboarding · Core causes & praxis prompt</h1>
              <p class="title-sub">Select up to ${screenRules.maxCausesCap} core causes (${memberProfile.causes.length}/${screenRules.maxCausesCap} selected) and write one concrete prompt.</p>
            </div>
            <button type="button" class="btn btn-primary" id="btnFinishToPraxis">Save & view praxis profile</button>
          </div>

          <div class="work-split">
            <div class="main-col">
              <section class="panel" aria-label="Causes and prompt editor">
                <div class="panel-head">
                  <h2 class="panel-title">Core causes (${memberProfile.causes.length} of ${screenRules.maxCausesCap})</h2>
                  <div class="seg" id="capSeg" role="group" aria-label="Max causes cap">
                    <button type="button" data-cap="3" aria-pressed="${screenRules.maxCausesCap === 3}">Cap 3</button>
                    <button type="button" data-cap="5" aria-pressed="${screenRules.maxCausesCap === 5}">Cap 5</button>
                  </div>
                </div>

                <div class="cause-row" id="onbCausesPicker">
                  ${ALL_CAUSES.map(
                    (c) =>
                      `<button type="button" class="cause-chip" data-toggle-cause="${c}" aria-pressed="${memberProfile.causes.includes(
                        c
                      )}">${c}</button>`
                  ).join('')}
                </div>

                <div style="padding-top:10px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:8px;">
                  <label style="font-size:var(--fs-small);color:var(--muted);">Choose prompt question</label>
                  <select id="selPromptTemplate" class="field-input">
                    ${PROMPT_TEMPLATES.map(
                      (tpl) =>
                        `<option value="${tpl}" ${
                          memberProfile.promptTemplate === tpl ? 'selected' : ''
                        }>${tpl}</option>`
                    ).join('')}
                  </select>
                  <label style="font-size:var(--fs-small);color:var(--muted);">Your answer</label>
                  <textarea id="txtOnbPraxis" class="field-textarea" rows="3">${memberProfile.praxisPrompt}</textarea>
                </div>
              </section>
            </div>

            <div class="rail-col">
              <h2 class="rail-heading">How comrades see your hooks</h2>
              <section class="panel">
                <div class="praxis-block">
                  <span style="font-size:var(--fs-small);color:var(--muted);">${memberProfile.promptTemplate}</span>
                  <span style="font-size:var(--fs-body);font-weight:500;">${memberProfile.praxisPrompt}</span>
                </div>
                <div class="cause-row">
                  ${memberProfile.causes.map((c) => `<span class="pill pill-crimson">${c}</span>`).join('')}
                </div>
              </section>
            </div>
          </div>
        `;
      }

      function renderPraxisScreen() {
        return `
          <div class="title-row">
            <div>
              <h1>Praxis profile & collective health</h1>
              <p class="title-sub">Active chapters, union density, and your live Drizzle schema state.</p>
            </div>
            <button type="button" class="btn btn-primary" id="btnEditCard">Edit onboarding steps</button>
          </div>

          <!-- Divided KPI strip (APP SHEET overview pattern) -->
          <div class="kpi-strip" role="region" aria-label="Collective metrics">
            <div class="kpi-cell">
              <span class="kpi-label">Active comrades across 3 chapters</span>
              <span class="kpi-val">${totalMembers} members</span>
              <span class="kpi-sub">+8 on last week's cohort</span>
            </div>
            <div class="kpi-cell">
              <span class="kpi-label">Unionized members</span>
              <span class="kpi-val">${totalUnionized} members</span>
              <span class="kpi-sub">61.5% of active chapters</span>
            </div>
            <div class="kpi-cell">
              <span class="kpi-label">Mutual solidarity matches (7d)</span>
              <span class="kpi-val">${totalWeeklyMatches} matches</span>
              <span class="kpi-sub">100% opened with a cause note</span>
            </div>
          </div>

          <div class="work-split">
            <div class="main-col">
              <!-- Main chart card: weekly solidarity matches with 1 accent hue -->
              <section class="panel" aria-label="Weekly solidarity matches chart">
                <div class="panel-head">
                  <div>
                    <h2 class="panel-title">Weekly mutual solidarity matches</h2>
                    <div style="font-size:var(--fs-small);color:var(--muted);">Past 6 weeks across São Paulo, Rio de Janeiro, and Florianópolis</div>
                  </div>
                  <span class="pill pill-crimson">14 matches this week</span>
                </div>
                <svg viewBox="0 0 560 170" style="width:100%;height:auto;display:block;" aria-label="Line chart of weekly matches">
                  <line x1="36" y1="24" x2="540" y2="24" stroke="var(--rule)" stroke-width="1" />
                  <line x1="36" y1="68" x2="540" y2="68" stroke="var(--rule)" stroke-width="1" />
                  <line x1="36" y1="112" x2="540" y2="112" stroke="var(--rule)" stroke-width="1" />
                  <line x1="36" y1="144" x2="540" y2="144" stroke="var(--rule)" stroke-width="1" />
                  <text x="28" y="28" text-anchor="end" fill="var(--muted)" font-size="11">16</text>
                  <text x="28" y="72" text-anchor="end" fill="var(--muted)" font-size="11">10</text>
                  <text x="28" y="116" text-anchor="end" fill="var(--muted)" font-size="11">5</text>
                  <text x="28" y="147" text-anchor="end" fill="var(--muted)" font-size="11">0</text>
                  <polyline
                    fill="none"
                    stroke="var(--accent)"
                    stroke-width="2"
                    points="56,122 150,106 244,92 338,76 432,54 524,36"
                  />
                  <text x="56" y="162" text-anchor="middle" fill="var(--muted)" font-size="11">Oct 6</text>
                  <text x="150" y="162" text-anchor="middle" fill="var(--muted)" font-size="11">Oct 13</text>
                  <text x="244" y="162" text-anchor="middle" fill="var(--muted)" font-size="11">Oct 20</text>
                  <text x="338" y="162" text-anchor="middle" fill="var(--muted)" font-size="11">Oct 27</text>
                  <text x="432" y="162" text-anchor="middle" fill="var(--muted)" font-size="11">Nov 3</text>
                  <text x="524" y="162" text-anchor="middle" fill="var(--text)" font-weight="600" font-size="11">Nov 10</text>
                </svg>
              </section>

              <!-- Chapter breakdown table -->
              <section class="panel" aria-label="Chapter breakdown table">
                <h2 class="panel-title">Collective chapters reconciliation</h2>
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>Chapter city</th>
                      <th class="num">Active comrades</th>
                      <th class="num">Unionized</th>
                      <th class="num">7d matches</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${CHAPTER_ROWS.map(
                      (r) => `
                      <tr>
                        <td>${r.city}</td>
                        <td class="num">${r.members}</td>
                        <td class="num">${r.unionized}</td>
                        <td class="num">${r.weeklyMatches}</td>
                      </tr>
                    `
                    ).join('')}
                    <tr style="font-weight:600;">
                      <td>Total across chapters</td>
                      <td class="num">${totalMembers}</td>
                      <td class="num">${totalUnionized}</td>
                      <td class="num">${totalWeeklyMatches}</td>
                    </tr>
                  </tbody>
                </table>
              </section>
            </div>

            <div class="rail-col">
              <h2 class="rail-heading">Your live praxis card</h2>
              <section class="panel">
                <div>
                  <div class="panel-title">${memberProfile.displayName}, ${memberProfile.age}</div>
                  <div style="font-size:var(--fs-small);color:var(--muted);">${memberProfile.pronouns} · ${memberProfile.city} (${memberProfile.neighborhood})</div>
                </div>
                <div class="cause-row">
                  <span class="pill pill-crimson">${memberProfile.tendency}</span>
                  ${memberProfile.unionMember ? `<span class="pill pill-neutral">${memberProfile.unionName}</span>` : ''}
                </div>
                <div class="praxis-block">
                  <span style="font-size:var(--fs-small);color:var(--muted);">${memberProfile.promptTemplate}</span>
                  <span style="font-size:var(--fs-data);">${memberProfile.praxisPrompt}</span>
                </div>
                <div class="cause-row">
                  ${memberProfile.causes.map((c) => `<span class="pill pill-neutral">${c}</span>`).join('')}
                </div>
              </section>
            </div>
          </div>
        `;
      }

      function renderCanvas() {
        updateNavCounts();
        $$('[data-screen]').forEach((b) => {
          if (b.getAttribute('data-screen') === activeScreen) {
            b.setAttribute('aria-current', 'page');
          } else {
            b.removeAttribute('aria-current');
          }
        });

        const canvas = $('#mainCanvas');
        if (activeScreen === 'queue') {
          canvas.innerHTML = renderQueueScreen();
          $$('[data-bucket]').forEach((b) => {
            b.addEventListener('click', () => {
              queueBucket = b.getAttribute('data-bucket');
              candidateIndex = 0;
              renderCanvas();
            });
          });
          const btnNext = $('#btnNextCandidate');
          if (btnNext) {
            btnNext.addEventListener('click', () => {
              const list = bucketedCandidates(baseFilteredCandidates());
              if (list.length) candidateIndex = (candidateIndex + 1) % list.length;
              renderCanvas();
            });
          }
          const btnReset = $('#btnResetQueue') || $('#btnEmptyReset');
          if (btnReset) {
            btnReset.addEventListener('click', () => {
              queueCandidates = INITIAL_CANDIDATES.slice();
              queueBucket = 'all';
              cityFilter = 'All';
              $('#citySelect').value = 'All';
              candidateIndex = 0;
              renderCanvas();
            });
          }
          const btnPraxisHook = $('#btnSelectPraxisHook');
          if (btnPraxisHook) {
            btnPraxisHook.addEventListener('click', () => {
              selectedHook = { type: 'praxis', label: 'Praxis Prompt' };
              draftNote = 'Loved your praxis prompt, when are we making this happen?';
              renderCanvas();
            });
          }
          $$('[data-hook-cause]').forEach((b) => {
            b.addEventListener('click', () => {
              const c = b.getAttribute('data-hook-cause');
              selectedHook = { type: 'cause', label: c };
              draftNote = `Solidarity on ${c}, would love to connect and swap notes!`;
              renderCanvas();
            });
          });
          const inpNote = $('#inpSolidarityNote');
          if (inpNote) {
            inpNote.addEventListener('input', (e) => {
              draftNote = e.target.value;
            });
          }
          const btnPass = $('#btnPassComrade');
          if (btnPass) {
            btnPass.addEventListener('click', () => {
              const list = bucketedCandidates(baseFilteredCandidates());
              const cand = list[candidateIndex];
              if (cand) {
                queueCandidates = queueCandidates.filter((x) => x.id !== cand.id);
              }
              renderCanvas();
            });
          }
          const btnSend = $('#btnSendSolidarity');
          if (btnSend) {
            btnSend.addEventListener('click', () => {
              const list = bucketedCandidates(baseFilteredCandidates());
              const cand = list[candidateIndex];
              if (!cand) return;
              const noteText =
                draftNote.trim() || `Solidarity on ${selectedHook.label}!`;
              if (screenRules.requireSolidarityNote && !draftNote.trim()) return;
              queueCandidates = queueCandidates.filter((x) => x.id !== cand.id);
              const newMatchId = 'match-' + cand.id;
              matches.unshift({
                id: newMatchId,
                comrade: cand,
                matchedAt: 'Just now',
                hookLabel: selectedHook.label,
                solidarityNote: noteText,
                coopVenue: 'Armazém do Campo (MST Cooperative) · Centro',
                messages: [
                  { sender: 'me', time: 'Now', text: noteText },
                  {
                    sender: 'them',
                    time: 'Now',
                    text: `Solidarity, ${memberProfile.displayName}! Glad you reached out about ${selectedHook.label}.`
                  }
                ]
              });
              activeMatchId = newMatchId;
              activeScreen = 'inbox';
              renderCanvas();
            });
          }
          $$('[data-jump-idx]').forEach((b) => {
            b.addEventListener('click', () => {
              candidateIndex = Number(b.getAttribute('data-jump-idx'));
              renderCanvas();
            });
          });
          $('#togTendency').addEventListener('change', (e) => {
            screenRules.showTendencyPill = e.target.checked;
            renderCanvas();
          });
          $('#togUnion').addEventListener('change', (e) => {
            screenRules.showUnionBadge = e.target.checked;
            renderCanvas();
          });
          $('#togDistance').addEventListener('change', (e) => {
            screenRules.showNeighborhoodDistance = e.target.checked;
            renderCanvas();
          });
          $('#togRequireNote').addEventListener('change', (e) => {
            screenRules.requireSolidarityNote = e.target.checked;
            renderCanvas();
          });
          return;
        }

        if (activeScreen === 'inbox') {
          canvas.innerHTML = renderInboxScreen();
          $('#btnBackToQueue').addEventListener('click', () => {
            activeScreen = 'queue';
            renderCanvas();
          });
          $$('[data-open-match]').forEach((b) => {
            b.addEventListener('click', () => {
              activeMatchId = b.getAttribute('data-open-match');
              renderCanvas();
            });
          });
          const btnReply = $('#btnSendChatReply');
          if (btnReply) {
            btnReply.addEventListener('click', () => {
              const inp = $('#inpChatReply');
              const txt = inp ? inp.value.trim() : '';
              if (!txt) return;
              const m = matches.find((x) => x.id === activeMatchId) || matches[0];
              if (m) {
                m.messages.push({ sender: 'me', time: 'Now', text: txt });
                renderCanvas();
              }
            });
          }
          $('#togPinBanner').addEventListener('change', (e) => {
            screenRules.pinSolidarityBannerInChat = e.target.checked;
            renderCanvas();
          });
          $('#togCoopVenue').addEventListener('change', (e) => {
            screenRules.showCoopDateIdeasInChat = e.target.checked;
            renderCanvas();
          });
          return;
        }

        if (activeScreen === 'identity') {
          canvas.innerHTML = renderIdentityScreen();
          $('#inpOnbName').addEventListener('input', (e) => {
            memberProfile.displayName = e.target.value;
          });
          $('#inpOnbPronouns').addEventListener('input', (e) => {
            memberProfile.pronouns = e.target.value;
          });
          $('#inpOnbCity').addEventListener('input', (e) => {
            memberProfile.city = e.target.value;
          });
          $('#inpOnbNeighborhood').addEventListener('input', (e) => {
            memberProfile.neighborhood = e.target.value;
          });
          $$('[data-pick-tendency]').forEach((b) => {
            b.addEventListener('click', () => {
              memberProfile.tendency = b.getAttribute('data-pick-tendency');
              renderCanvas();
            });
          });
          $('#chkOnbUnion').addEventListener('change', (e) => {
            memberProfile.unionMember = e.target.checked;
            renderCanvas();
          });
          const inpU = $('#inpOnbUnionName');
          if (inpU) {
            inpU.addEventListener('input', (e) => {
              memberProfile.unionName = e.target.value;
            });
          }
          $('#btnGoCausesStep').addEventListener('click', () => {
            activeScreen = 'causes';
            renderCanvas();
          });
          return;
        }

        if (activeScreen === 'causes') {
          canvas.innerHTML = renderCausesScreen();
          $$('#capSeg [data-cap]').forEach((b) => {
            b.addEventListener('click', () => {
              screenRules.maxCausesCap = Number(b.getAttribute('data-cap'));
              if (memberProfile.causes.length > screenRules.maxCausesCap) {
                memberProfile.causes = memberProfile.causes.slice(0, screenRules.maxCausesCap);
              }
              renderCanvas();
            });
          });
          $$('[data-toggle-cause]').forEach((b) => {
            b.addEventListener('click', () => {
              const c = b.getAttribute('data-toggle-cause');
              if (memberProfile.causes.includes(c)) {
                memberProfile.causes = memberProfile.causes.filter((x) => x !== c);
              } else if (memberProfile.causes.length < screenRules.maxCausesCap) {
                memberProfile.causes = [...memberProfile.causes, c];
              }
              renderCanvas();
            });
          });
          $('#selPromptTemplate').addEventListener('change', (e) => {
            memberProfile.promptTemplate = e.target.value;
            renderCanvas();
          });
          $('#txtOnbPraxis').addEventListener('input', (e) => {
            memberProfile.praxisPrompt = e.target.value;
          });
          $('#btnFinishToPraxis').addEventListener('click', () => {
            activeScreen = 'praxis';
            renderCanvas();
          });
          return;
        }

        if (activeScreen === 'praxis') {
          canvas.innerHTML = renderPraxisScreen();
          $('#btnEditCard').addEventListener('click', () => {
            activeScreen = 'identity';
            renderCanvas();
          });
        }
      }

      // Wire shell navigation
      $$('[data-screen]').forEach((b) => {
        b.addEventListener('click', () => {
          activeScreen = b.getAttribute('data-screen');
          renderCanvas();
        });
      });

      $('#globalSearch').addEventListener('input', (e) => {
        searchFilter = e.target.value;
        candidateIndex = 0;
        renderCanvas();
      });

      $('#citySelect').addEventListener('change', (e) => {
        cityFilter = e.target.value;
        candidateIndex = 0;
        renderCanvas();
      });

      $$('#langSeg [data-lang]').forEach((b) => {
        b.addEventListener('click', () => {
          lang = b.getAttribute('data-lang');
          $$('#langSeg [data-lang]').forEach((x) =>
            x.setAttribute('aria-pressed', String(x.getAttribute('data-lang') === lang))
          );
          renderCanvas();
        });
      });

      $$('#themeSeg [data-theme-mode]').forEach((b) => {
        b.addEventListener('click', () => {
          const mode = b.getAttribute('data-theme-mode');
          document.documentElement.setAttribute('data-theme', mode);
          $$('#themeSeg [data-theme-mode]').forEach((x) =>
            x.setAttribute('aria-pressed', String(x.getAttribute('data-theme-mode') === mode))
          );
        });
      });

      $('#btnCopySpec').addEventListener('click', () => {
        const spec = JSON.stringify({ screenRules, memberProfile }, null, 2);
        try {
          navigator.clipboard.writeText(spec);
        } catch (e) {}
        $('#specStatusText').textContent = 'Copied current screen rules & profile JSON!';
      });

      renderCanvas();
    })();
  </script>
</body>
</html>
