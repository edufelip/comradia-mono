<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comradia Option D Refined</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pg:#ECEAE6;--panel:#FFFFFF;--panel2:#F6F5F2;--line:#DDD9D2;--text:#16151A;--muted:#6E6A72;--acc:#16151A;--accT:#FFFFFF;--spring:cubic-bezier(.22,1,.36,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#111013;--panel:#1A191D;--panel2:#222126;--line:#2E2C33;--text:#F1EFEC;--muted:#9C98A2;--acc:#F1EFEC;--accT:#111013}}
:root[data-theme="dark"]{--pg:#111013;--panel:#1A191D;--panel2:#222126;--line:#2E2C33;--text:#F1EFEC;--muted:#9C98A2;--acc:#F1EFEC;--accT:#111013}
/* the three red presets — every phone colour comes from these */
[data-p="d1"]{--bg:#FBF6F4;--ink:#231214;--pri:#D92D3A;--sec:#E05A47;--blush:#FCE8E9;--mut:#7A5A5C;--ln:#EFDCDA;--card:#FFFFFF;--tagbg:#FFFFFF;--tagfg:#231214;--deep:#8E1622;--sun1:#FFD9C7}
[data-p="d2"]{--bg:#FFF9F8;--ink:#1F0F12;--pri:#E11D48;--sec:#FF4D5E;--blush:#FFE4E8;--mut:#7C5E62;--ln:#EBDCCB;--card:#FFFFFF;--tagbg:#FFFFFF;--tagfg:#1F0F12;--deep:#9F1239;--sun1:#FFD3D8}
[data-p="d3"]{--bg:#F7EFEA;--ink:#2A1513;--pri:#B91C2C;--sec:#C84B31;--blush:#F3E1DA;--mut:#6E5B55;--ln:#E6D6CC;--card:#FFFCFA;--tagbg:#E3E6DF;--tagfg:#4F5B52;--deep:#6E0F18;--sun1:#F5D2BE}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{font-family:Inter,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
.app{position:relative;background:var(--pg);border-radius:20px;padding:28px 28px 22px;max-width:1560px;margin:0 auto}

/* ---------- page chrome ---------- */
.top h1{font:400 40px/1 'Instrument Serif',serif;letter-spacing:-.01em}
.top h1 i{color:#D92D3A}
.top p{color:var(--muted);font-size:14px;margin-top:8px;max-width:720px;line-height:1.45}
.bar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:20px 0 8px}
.lbl{font:600 10.5px/1 Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:-4px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);transition:background .25s,color .25s;white-space:nowrap;display:flex;align-items:center;gap:8px}
.seg button.on{background:var(--acc);color:var(--accT)}
.seg .dots{display:flex}.seg .dots i{width:12px;height:12px;border-radius:50%;margin-left:-3px;box-shadow:0 0 0 1.5px var(--panel)}
.rec{font-size:10px;font-weight:700;padding:2px 6px;border-radius:999px;background:#D92D3A;color:#fff}
.view{display:none}.app.v-flow .view.flow,.app.v-cmp .view.cmp{display:block}

/* flow canvas */
.flow{position:relative;margin-top:6px;overflow-x:auto;overflow-y:hidden;border-radius:24px;background:var(--panel);border:1px solid var(--line);padding:96px 26px 70px}
.frow{position:relative;display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:46px;min-width:1250px}
.arcs{position:absolute;inset:0;pointer-events:none;overflow:visible}
.arcs .base{fill:none;stroke:var(--fc,#D92D3A);stroke-width:2;opacity:.35}
.arcs .pulse{fill:none;stroke:var(--fc,#D92D3A);stroke-width:2.5;stroke-dasharray:2 14;stroke-linecap:round;animation:flowA 1s linear infinite}
.arcs .back .base{stroke-dasharray:6 6}
@keyframes flowA{to{stroke-dashoffset:-16}}
.arcs .edge.flash .base{opacity:1;stroke-width:4}
.elab{position:absolute;transform:translate(-50%,-50%);background:var(--panel);border:1.5px solid var(--fc,#D92D3A);color:var(--text);font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;white-space:nowrap;box-shadow:0 8px 18px -12px rgba(0,0,0,.4);pointer-events:none;transition:transform .3s var(--spring)}
.elab em{font-style:normal;color:var(--fc);margin-right:5px;font-weight:700}
.elab.flash{transform:translate(-50%,-50%) scale(1.1)}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.cap{display:flex;gap:10px;align-items:flex-start}
.cap b{flex:none;width:26px;height:26px;border-radius:9px;background:var(--fc,#D92D3A);color:#fff;display:grid;place-items:center;font-size:13px}
.cap div{font-size:14px;font-weight:700;line-height:1.2}
.cap small{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:3px;line-height:1.35}
.pw{position:relative;width:100%;margin:0 auto;transition:transform .5s var(--spring)}
.pw.beat{animation:beat .7s var(--spring)}
@keyframes beat{40%{transform:scale(1.035)}}

/* compare */
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:6px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:14px;transition:box-shadow .3s,border-color .3s}
.pc.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri),0 24px 50px -30px var(--pri)}
.pc-h{display:flex;align-items:center;gap:10px}
.pc-h .k{width:34px;height:34px;border-radius:11px;background:var(--pri);color:#fff;font:700 13px Inter;display:grid;place-items:center}
.pc-h div{font-weight:700;font-size:15px;line-height:1.2}.pc-h small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.pc-h .rec{margin-left:auto}
.pc-ph{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw span{display:flex;align-items:center;gap:6px;font:500 10.5px 'DM Mono',monospace;color:var(--muted)}
.sw i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.pc p{font-size:12.5px;line-height:1.5;color:var(--muted)}
.use{height:42px;border-radius:14px;font-weight:700;font-size:13.5px;background:var(--acc);color:var(--accT)}
.pc.on .use{background:var(--pri);color:#fff}

/* handoff bar */
.hand{position:sticky;bottom:12px;margin-top:20px;z-index:20;display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:0 18px 40px -22px rgba(0,0,0,.35)}
.hand .t{font-size:13px;font-weight:700;white-space:nowrap}.hand .t small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.chip{flex:1;min-width:0;font:500 12px/1.4 'DM Mono',monospace;background:var(--panel2);border:1px dashed var(--line);border-radius:12px;padding:9px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);user-select:all}
.copy{height:40px;padding:0 16px;border-radius:12px;background:var(--acc);color:var(--accT);font-weight:700;font-size:13px;white-space:nowrap}

/* ---------- device ---------- */
.dev{position:absolute;left:0;top:0;width:415px;height:874px;padding:11px;border-radius:66px;transform-origin:0 0;background:linear-gradient(150deg,#4a4a4f,#151517 30%,#2c2c30 70%,#111);box-shadow:0 0 0 1px #000,inset 0 0 0 1.5px #66666c,0 50px 70px -40px rgba(0,0,0,.55)}
.ph{position:relative;width:393px;height:852px;border-radius:55px;overflow:hidden;overflow:clip;isolation:isolate;user-select:none;background:var(--bg);color:var(--ink);font-family:Outfit,sans-serif}
.isl{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:60}
.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:4px 34px 0 46px;font:600 16px/1 Inter;z-index:59;pointer-events:none}
.sb .r{display:flex;gap:6px;align-items:center}
.hi{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:138px;height:5px;border-radius:3px;background:currentColor;opacity:.85;z-index:59;pointer-events:none}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.rv{animation:rvUp .8s var(--spring) both;animation-delay:calc(var(--d,0) * 70ms + 60ms)}
@keyframes rvUp{from{opacity:0;transform:translateY(16px)}}
.pt{position:absolute;inset:0;width:100%;height:100%;display:block}
.mono{font-family:'DM Mono',monospace;font-weight:500;letter-spacing:.05em}
.tst{position:absolute;left:50%;top:66px;z-index:58;transform:translate(-50%,-20px);opacity:0;transition:.45s var(--spring);white-space:nowrap;pointer-events:none;background:var(--ink);color:var(--bg);font:600 14px Outfit;padding:10px 16px;border-radius:999px}
.tst.on{opacity:1;transform:translate(-50%,0)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:58px;border-radius:999px;font:600 17px Outfit;transition:transform .2s var(--spring),filter .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);color:#fff;box-shadow:0 14px 26px -14px var(--pri)}
.btn.pri:hover{filter:brightness(1.06)}
.bump{animation:bump .4s var(--spring)}
@keyframes bump{40%{transform:scale(.86)}}

/* S1 welcome */
.w{padding:62px 24px 32px}
.sun{position:absolute;top:-104px;right:-108px;width:280px;height:280px;pointer-events:none}
.sun .rays{animation:spinS 60s linear infinite;transform-origin:140px 140px}
@keyframes spinS{to{transform:rotate(360deg)}}
.topo{position:absolute;left:-90px;bottom:120px;width:330px;height:330px;pointer-events:none;opacity:.55}
.fn{font-size:10.5px;line-height:1.55;color:var(--mut);position:relative}
.fn b{color:var(--pri);font-weight:500}
.w h1{font:600 47px/.98 Outfit;letter-spacing:-.04em;margin-top:24px;position:relative}
.w h1 em{font-style:normal;color:var(--pri)}
.w .lede{font-size:16px;line-height:1.45;color:var(--mut);margin-top:14px;position:relative}
.dmap{position:relative;margin-top:20px;background:var(--card);border-radius:28px;padding:12px;box-shadow:0 18px 30px -22px rgba(35,18,20,.45)}
.dmap svg{display:block;width:100%;height:auto;border-radius:18px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 2px;font-size:14px;font-weight:600}
.mrow small{font-size:9.5px;color:var(--mut)}
.faces{display:flex;align-items:center;gap:10px;margin-top:auto;font-size:13px;color:var(--mut);position:relative}
.faces>div{display:flex}
.faces .f{position:relative;width:34px;height:34px;border-radius:50%;overflow:hidden;border:2.5px solid var(--bg);margin-left:-9px}
.faces .f:first-child{margin-left:0}
.faces b{color:var(--ink)}
.w .btn{margin-top:16px}
.sub{margin-top:12px;text-align:center;font-size:14.5px;color:var(--mut);font-weight:500}
.sub b{color:var(--ink);font-weight:600}

/* S2 values */
.ob{padding:58px 22px 30px}
.obt{display:flex;align-items:center;gap:14px}
.circ{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none;box-shadow:0 4px 12px -8px rgba(0,0,0,.3)}
.prog{flex:1;display:flex;gap:6px}.prog i{flex:1;height:5px;border-radius:3px;background:var(--ln)}.prog i.on{background:var(--pri)}
.ob .stp{font-size:10.5px;color:var(--mut);margin-top:22px}
.ob h2{font:600 36px/1.02 Outfit;letter-spacing:-.035em;margin-top:8px}
.ob .lead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;color:var(--mut);margin-top:10px}
.cnt{font-size:11px;background:var(--blush);color:var(--pri);padding:6px 10px;border-radius:999px;flex:none}
.vals{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.val{padding:10px 14px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--ln);font-size:14.5px;font-weight:500;transition:background .25s,color .25s,box-shadow .25s,transform .25s var(--spring)}
.val.on{background:var(--pri);color:#fff;box-shadow:none}
.val:active{transform:scale(.95)}
.val.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.lk{margin-top:22px;font-size:10.5px;color:var(--mut)}
.look{display:flex;gap:6px;margin-top:8px;background:var(--card);border-radius:999px;padding:4px;box-shadow:inset 0 0 0 1.5px var(--ln)}
.look button{flex:1;height:38px;border-radius:999px;font:500 13px Outfit;color:var(--mut);transition:.25s}
.look button.on{background:var(--ink);color:var(--bg)}
.ob .btn{margin-top:auto}
.ob .note{text-align:center;font-size:12.5px;color:var(--mut);margin-top:10px}

/* S3 discovery */
.d{padding-top:54px}
.dh{padding:6px 20px 0}
.dh .row{display:flex;justify-content:space-between;align-items:center}
.wm{font:700 26px/1 Outfit;letter-spacing:-.04em;display:flex;align-items:center;gap:6px}
.wm span{color:var(--pri)}
.rt{display:flex;gap:8px;align-items:center}
.mchip{font-size:10.5px;background:var(--card);border-radius:999px;padding:8px 11px}
.ib{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.wx{font-size:10px;color:var(--mut);margin-top:8px}
.deck{position:relative;flex:1;margin:12px 16px 0}
.card{position:absolute;inset:0;touch-action:none;will-change:transform}
.card.back{pointer-events:none;transform:scale(.94) translateY(14px);filter:brightness(.95);animation:backIn .45s var(--spring) both}
@keyframes backIn{from{opacity:0;transform:scale(.88) translateY(30px)}}
.card.top{cursor:grab}.card.top.drag{cursor:grabbing}
.cin{position:absolute;inset:0;background:var(--card);border-radius:34px;padding:12px;display:flex;flex-direction:column;box-shadow:0 24px 40px -28px rgba(35,18,20,.55)}
.photo{position:relative;flex:1;border-radius:170px 170px 26px 26px;overflow:hidden}
.tag{position:absolute;left:10px;bottom:10px;font-size:10.5px;background:var(--card);color:var(--ink);padding:6px 10px;border-radius:999px;z-index:2}
.pdots{position:absolute;right:12px;bottom:14px;display:flex;gap:5px;z-index:2}
.pdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6);transition:width .3s}.pdots i.on{background:#fff;width:18px;border-radius:4px}
.info{padding:12px 6px 2px}
.nm{font:600 30px/1 Outfit;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.vb{width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center}
.meta{font-size:10.5px;color:var(--mut);margin-top:6px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{font-size:12.5px;font-weight:500;padding:6px 11px;border-radius:999px;background:var(--tagbg);color:var(--tagfg);box-shadow:inset 0 0 0 1px var(--ln)}
.pill.sh{background:var(--blush);color:var(--pri);box-shadow:none}
.s1{position:absolute;inset:0;background:var(--blush);padding:58px 20px 18px;display:flex;flex-direction:column;animation:slIn .35s ease both}
@keyframes slIn{from{opacity:.2}}
.s1 .k{font-size:10.5px;color:var(--pri)}
.s1 .q{font-size:15px;color:var(--mut);margin-top:8px;font-weight:500}
.s1 .big{font:500 24px/1.15 Outfit;letter-spacing:-.02em;margin-top:6px}
.gd{margin-top:auto;background:var(--card);border-radius:20px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}
.gd i{width:36px;height:36px;border-radius:50%;background:var(--blush);display:grid;place-items:center;font-style:normal;flex:none;font-size:17px}
.gd small{display:block;font-size:9.5px;color:var(--mut)}
.stamp{position:absolute;top:70px;z-index:20;opacity:0;pointer-events:none;font:700 32px Outfit;letter-spacing:.02em;padding:4px 18px;border-radius:999px}
.stamp.like{left:22px;background:var(--pri);color:#fff;transform:rotate(-10deg)}.stamp.pass{right:22px;background:var(--ink);color:var(--bg);transform:rotate(10deg)}
.acts{display:flex;justify-content:center;align-items:center;gap:18px;padding:16px 0 10px}
.acts button{border-radius:50%;display:grid;place-items:center;transition:transform .25s var(--spring)}
.acts button:active{transform:scale(.9)}
.acts .pass{width:60px;height:60px;background:var(--card);box-shadow:0 8px 20px -10px rgba(35,18,20,.45)}
.acts .note{width:52px;height:52px;background:var(--sec);color:#fff}
.acts .like{width:60px;height:60px;background:var(--pri);color:#fff;box-shadow:0 12px 22px -10px var(--pri)}
.tb{margin:0 20px 28px;background:var(--card);border-radius:999px;display:flex;justify-content:space-between;padding:6px;color:var(--mut)}
.tb span{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600}
.tb .on{background:var(--pri);color:#fff}

/* S4 match */
.mt{background:radial-gradient(130% 80% at 50% 0%,var(--sec) 0%,var(--pri) 48%,var(--deep) 100%);color:#fff;align-items:center;text-align:center;padding:84px 26px 34px}
.mt .rays2{position:absolute;top:120px;left:50%;width:520px;height:520px;margin-left:-260px;pointer-events:none;opacity:.14;animation:spinS 50s linear infinite}
.mt canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.mt .k{font-size:11px;letter-spacing:.14em;opacity:.8;position:relative}
.mt h2{font:700 56px/.95 Outfit;letter-spacing:-.045em;margin-top:12px;position:relative}
.mt .lede{font-size:16px;opacity:.88;margin-top:10px;position:relative}
.duo{position:relative;width:300px;height:250px;margin-top:26px}
.arch{position:absolute;top:10px;width:150px;height:205px;border-radius:80px 80px 22px 22px;overflow:hidden;border:5px solid #fff;box-shadow:0 24px 40px -18px rgba(0,0,0,.5)}
.arch.a1{left:16px;transform:rotate(-7deg);animation:inL .9s var(--spring) both .1s}
.arch.a2{right:16px;transform:rotate(7deg);animation:inR .9s var(--spring) both .1s}
@keyframes inL{from{transform:translateX(-90px) rotate(-20deg);opacity:0}}
@keyframes inR{from{transform:translateX(90px) rotate(20deg);opacity:0}}
.hb{position:absolute;left:50%;bottom:16px;width:62px;height:62px;margin-left:-31px;border-radius:50%;background:#fff;color:var(--pri);display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);animation:pop .7s var(--spring) both .55s;z-index:2}
@keyframes pop{from{transform:scale(0)}}
.both{position:relative;margin-top:16px;font-size:14px;font-weight:500;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.3);padding:10px 16px;border-radius:999px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.both b{font-weight:700}
.mt .btns{margin-top:auto;width:100%;display:flex;flex-direction:column;gap:10px;position:relative;z-index:4}
.btn.wht{background:#fff;color:var(--pri)}
.btn.gh{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6);color:#fff}

/* S5 chat */
.ch{padding-top:54px}
.chh{display:flex;align-items:center;gap:12px;padding:8px 16px 12px;border-bottom:1px solid var(--ln)}
.chh .back{width:36px;height:36px;display:grid;place-items:center}
.av{position:relative;width:42px;height:50px;border-radius:22px 22px 10px 10px;overflow:hidden;flex:none}
.chh b{font-size:17px;font-weight:600;display:block}.chh small{font-size:12.5px;color:var(--pri);font-weight:500}
.chh .ib{margin-left:auto}
.msgs{flex:1;overflow-y:auto;padding:14px 16px 10px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.msgs>*{flex-shrink:0}
.pin{align-self:center;font-size:12.5px;font-weight:500;background:var(--blush);color:var(--pri);padding:8px 13px;border-radius:999px}
.day{align-self:center;font-size:10px;color:var(--mut);margin:6px 0 2px}
.msg{max-width:78%;padding:11px 15px;border-radius:22px;font-size:15.5px;line-height:1.35;animation:msgIn .45s var(--spring) both}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.96)}}
.msg.them{align-self:flex-start;background:var(--card);border-bottom-left-radius:7px;box-shadow:inset 0 0 0 1px var(--ln)}
.msg.me{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:7px}
.typing{align-self:flex-start;display:flex;gap:4px;background:var(--card);padding:14px 16px;border-radius:22px;box-shadow:inset 0 0 0 1px var(--ln)}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{30%{transform:translateY(-4px);opacity:.5}}
.inv{align-self:flex-end;width:92%;background:var(--card);border-radius:24px;padding:14px;box-shadow:0 14px 30px -20px rgba(35,18,20,.5),inset 0 0 0 1px var(--ln);animation:msgIn .45s var(--spring) both}
.inv .k{font-size:10px;color:var(--pri)}
.vch{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.vch button{font:500 12px Outfit;padding:7px 10px;border-radius:999px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--ln);transition:.2s}
.vch button.on{background:var(--ink);color:var(--bg);box-shadow:none}
.vd{display:flex;gap:12px;align-items:center;margin-top:12px}
.vd i{width:50px;height:50px;border-radius:16px;background:var(--blush);display:grid;place-items:center;font-size:24px;font-style:normal;flex:none}
.vd b{font-size:17px;font-weight:600;display:block;letter-spacing:-.01em}.vd small{font-size:10px;color:var(--mut)}
.inv .btn{width:100%;height:46px;font-size:15px;margin-top:12px}
.inv .st{margin-top:12px;text-align:center;font-size:14px;font-weight:600;padding:12px;border-radius:999px;background:var(--blush);color:var(--pri)}
.inv .st.ok{background:var(--pri);color:#fff}
.comp{display:flex;gap:8px;align-items:center;padding:10px 14px 34px;border-top:1px solid var(--ln)}
.comp .cal{width:44px;height:44px;border-radius:50%;background:var(--sec);color:#fff;display:grid;place-items:center;flex:none}
.comp input{flex:1;height:44px;border-radius:999px;border:0;background:var(--card);box-shadow:inset 0 0 0 1px var(--ln);padding:0 16px;font:400 15px Outfit;color:var(--ink);outline:none}
.comp .send{width:44px;height:44px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;flex:none}

@media (max-width:1100px){.cgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}.app{padding:18px 16px}.hand{flex-wrap:wrap}.chip{flex-basis:100%;order:3}.flow{padding:96px 16px 70px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  <div class="stamp like">LIKE</div><div class="stamp pass">PASS</div>`;

S.discover = (pk) => `<div class="scr d">
  <div class="dh"><div class="row"><div class="wm" data-go="1"><span>${I('heart', 22)}</span>comradia</div><div class="rt"><span class="mchip mono">NEARBY · 06</span><button class="ib" aria-label="Filters">${I('filter', 18, 1.8)}</button></div></div>
  <div class="wx mono">☀ 24°C · PERFECT EVENING FOR A FIRST DATE</div></div>
  <div class="deck"></div>
  <div class="acts"><button class="pass" data-a="pass" aria-label="Pass">${I('x', 22, 2)}</button><button class="note" data-a="note" aria-label="Send a note">${I('pen', 20, 2)}</button><button class="like" data-a="like" aria-label="Like">${I('heart', 24)}</button></div>
  <nav class="tb"><span class="on">${I('cards', 18, 2)} Discover</span><span>${I('chat', 18, 2)}</span><span>${I('user', 18, 2)}</span></nav></div>`;

S.match = (pk) => { const p = PEOPLE.find(x => x.id === ST.match), sh = shared(p).slice(0, 2);
  return `<div class="scr mt"><svg class="rays2" viewBox="0 0 520 520" aria-hidden="true">${Array.from({ length: 24 }, (_, i) => `<rect x="255" y="0" width="10" height="200" rx="5" fill="#fff" transform="rotate(${i * 15} 260 260)"/>`).join('')}</svg><canvas width="786" height="1704"></canvas>
  <div class="k mono">YOU BOTH SWIPED RIGHT</div><h2>It’s a Match!</h2><div class="lede">You and ${p.first} liked each other.</div>
  <div class="duo"><div class="arch a1">${ptMe(pk)}</div><div class="arch a2">${pt(p, pk)}</div><div class="hb">${I('heart', 30)}</div></div>
  <div class="both">${sh.length ? `You both love <b>${sh.join('</b> + <b>')}</b>` : `New to each other — say hi 👋`}</div>
  <div class="btns"><button class="btn wht" data-go="5">${I('chat', 20, 2)} Send a message</button><button class="btn gh" data-go="3">Keep swiping</button></div></div>`; };

const inviteHTML = (id) => { const c = chatOf(id), v = VENUES[c.venue];
  return `<div class="k mono">SUGGEST A FIRST DATE SPOT</div><div class="vch">${Object.entries(VENUES).map(([k, x]) => `<button data-ven="${k}" class="${k === c.venue ? 'on' : ''}" ${c.state !== 'draft' ? 'disabled' : ''}>${x.ic} ${x.s}</button>`).join('')}</div>
  <div class="vd"><i>${v.ic}</i><div><b>${v.n}</b><small class="mono">${v.d}</small></div></div>
  ${c.state === 'draft' ? `<button class="btn pri" data-invite>Send invite</button>` : `<div class="st ${c.state === 'yes' ? 'ok' : ''}">${c.state === 'yes' ? `✓ ${PEOPLE.find(x => x.id === ST.match).first} said yes — see you there!` : `Waiting for ${PEOPLE.find(x => x.id === ST.match).first}…`}</div>`}`; };
S.chat = (pk, id) => { const p = PEOPLE.find(x => x.id === ST.match), sh = shared(p), c = chatOf(id);
  return `<div class="scr ch"><div class="chh"><button class="back" data-go="3" aria-label="Back">${I('back', 22, 2.2)}</button><div class="av">${pt(p, pk)}</div><div><b>${p.first}</b><small>● Active now</small></div><button class="ib" aria-label="Video call">${I('video', 19, 1.8)}</button></div>
  <div class="msgs">
    <div class="pin">💞 You matched today${sh[0] ? ` · both love ${sh[0]}` : ''}</div><div class="day mono">TODAY 18:42</div>
    <div class="msg them">Okay, a fellow ${(sh[0] || 'good taste').toLowerCase()} person 👀</div>
    <div class="msg me">Guilty. Your farmers-market date idea sold me.</div>
    <div class="msg them">So… are we doing this? 😄</div>
    <div class="inv">${inviteHTML(id)}</div>
    ${c.extra.map(m => `<div class="msg ${m.me ? 'me' : 'them'}">${esc(m.t)}</div>`).join('')}
  </div>
  <div class="comp"><button class="cal" data-cycle aria-label="Suggest a first date spot">${I('cal', 20, 2)}</button><input placeholder="Write a message…" aria-label="Message"><button class="send" aria-label="Send">${I('send', 18, 2)}</button></div></div>`; };

/* ---------- phone shell + scaling ---------- */
const ro = new ResizeObserver(es => es.forEach(e => fit(e.target)));
function fit(pw) { const k = Math.min(1, pw.clientWidth / 415); pw.style.height = 874 * k + 'px'; q('.dev', pw).style.transform = `scale(${k})`; pw._k = k; }
const phone = (id, kind) => `<div class="pw" data-ph="${id}" data-kind="${kind}"><div class="dev"><div class="ph"></div></div></div>`;
function paint(pw) {
  const id = pw.dataset.ph, kind = pw.dataset.kind, pk = pw.closest('[data-p]').dataset.p, ph = q('.ph', pw);
  ph.innerHTML = sb + S[kind](pk, id) + '<div class="tst"></div><div class="hi"></div>';
  q('.sb', ph).style.color = kind === 'match' ? '#fff' : 'var(--ink)';
  q('.hi', ph).style.color = kind === 'match' ? '#fff' : 'var(--ink)';
  if (kind === 'discover') renderDeck(pw);
  if (kind === 'match') confetti(q('canvas', ph));
  if (kind === 'chat') { const m = q('.msgs', ph); m.scrollTop = m.scrollHeight; }
}
function mount(root) { qa('.pw', root).forEach(pw => { ro.observe(pw); paint(pw); fit(pw); }); }

/* ---------- deck ---------- */
function renderDeck(pw) {
  const pk = pw.closest('[data-p]').dataset.p, st = deckOf(pw.dataset.ph), deck = q('.deck', pw);
  const p = PEOPLE[st.i % 3], n = PEOPLE[(st.i + 1) % 3];
  deck.innerHTML = `<div class="card back">${cardHTML(n, pk, 0)}</div><div class="card top">${cardHTML(p, pk, st.sl)}</div>`;
  bindCard(pw, q('.card.top', deck));
}
function bindCard(pw, card) {
  let d = null;
  card.addEventListener('pointerdown', e => { if (e.button) return; d = { x: e.clientX, y: e.clientY, k: pw._k || 1, id: e.pointerId, mv: 0, dx: 0 }; try { card.setPointerCapture(e.pointerId); } catch (_) { } card.style.transition = 'none'; card.classList.add('drag'); });
  card.addEventListener('pointermove', e => {
    if (!d || e.pointerId !== d.id) return;
    const dx = (e.clientX - d.x) / d.k, dy = (e.clientY - d.y) / d.k; d.mv = Math.max(d.mv, Math.abs(dx) + Math.abs(dy)); d.dx = dx;
    card.style.transform = `translate(${dx}px,${dy * .35}px) rotate(${dx * .06}deg)`;
    q('.stamp.like', card).style.opacity = Math.max(0, Math.min(1, dx / 90)); q('.stamp.pass', card).style.opacity = Math.max(0, Math.min(1, -dx / 90));
  });
  const up = e => {
    if (!d || e.pointerId !== d.id) return; card.classList.remove('drag'); const { dx, mv } = d; d = null;
    if (Math.abs(dx) > 110) return fling(pw, card, dx > 0 ? 'like' : 'pass');
    card.style.transition = 'transform .55s var(--spring)'; card.style.transform = ''; qa('.stamp', card).forEach(s => s.style.opacity = 0);
    if (mv < 6) { const st = deckOf(pw.dataset.ph), r = card.getBoundingClientRect(); st.sl = e.clientX - r.left > r.width * .4 ? (st.sl ? 0 : 1) : 0; card.innerHTML = cardHTML(PEOPLE[st.i % 3], pw.closest('[data-p]').dataset.p, st.sl); }
  };
  card.addEventListener('pointerup', up); card.addEventListener('pointercancel', up);
}
function fling(pw, card, a) {
  const st = deckOf(pw.dataset.ph), p = PEOPLE[st.i % 3];
  if (a !== 'note') q(`.stamp.${a}`, card).style.opacity = 1;
  card.style.transition = 'transform .5s cubic-bezier(.3,.6,.4,1)'; card.style.pointerEvents = 'none';
  card.style.transform = a === 'like' ? 'translate(560px,40px) rotate(28deg)' : a === 'pass' ? 'translate(-560px,40px) rotate(-28deg)' : 'translate(0,-900px) rotate(-4deg)';
  const mutual = a !== 'pass' && p.likesYou;
  toast(pw, a === 'like' ? (mutual ? `${p.first} liked you too ♥` : `You liked ${p.first}`) : a === 'note' ? `✎ Note sent to ${p.first}` : `Passed`);
  setTimeout(() => { st.i++; st.sl = 0; renderDeck(pw); }, 380);
  if (mutual) { ST.match = p.id; setTimeout(() => go(pw, 4), 700); }
}
function toast(pw, t) { const el = q('.tst', pw); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1600); }

/* ---------- navigation between flow screens ---------- */
const FLOW = [['f1', 'welcome', 'Welcome', 'First screen · S1'], ['f2', 'values', 'Values & interests', 'Onboarding step 2 of 3'], ['f3', 'discover', 'Discovery card', 'Arch portrait · drag or tap · S5'], ['f4', 'match', 'It’s a Match!', 'Celebration overlay · S8'], ['f5', 'chat', 'Chat & first date spot', 'Message + date invite · S10']];
const EDGES = [{ f: 1, t: 2, l: 'Find Your Person' }, { f: 2, t: 3, l: 'Continue' }, { f: 3, t: 4, l: 'Like ♥ — it’s mutual' }, { f: 4, t: 5, l: 'Send a message' }, { f: 4, t: 3, l: 'Keep swiping', back: true }];
function go(pw, n) {
  const flowRoot = pw.closest('#flow');
  if (!flowRoot) { // compare view: phones are fixed per screen, just nudge
    pw.classList.remove('beat'); void pw.offsetWidth; pw.classList.add('beat'); return;
  }
  const from = FLOW.findIndex(f => f[0] === pw.dataset.ph) + 1, target = q(`.pw[data-ph="f${n}"]`, flowRoot);
  const ei = EDGES.findIndex(e => (e.f === from && e.t === n) || (e.f === n && e.t === from && !e.back));
  if (ei > -1) { const g = q(`.edge[data-e="${ei}"]`), l = q(`.elab[data-e="${ei}"]`); [g, l].forEach(x => { x.classList.add('flash'); setTimeout(() => x.classList.remove('flash'), 1400); }); }
  if (n === 4 || n === 5) paint(target); // re-render with the latest match / values
  if (n === 3) renderDeck(target);
  target.classList.remove('beat'); void target.offsetWidth; target.classList.add('beat');
  const fl = q('#flow'), r = target.getBoundingClientRect(), fr = fl.getBoundingClientRect();
  if (r.left < fr.left || r.right > fr.right) fl.scrollBy({ left: r.left - fr.left - fr.width / 2 + r.width / 2, behavior: 'smooth' });
}
function drawArcs() {
  const fl = q('#flow'), svg = q('#arcs'), fb = fl.getBoundingClientRect(); if (!fb.width) return;
  const W = fl.scrollWidth, Hh = fl.scrollHeight; svg.setAttribute('width', W); svg.setAttribute('height', Hh); svg.setAttribute('viewBox', `0 0 ${W} ${Hh}`);
  const box = n => { const r = q(`.pw[data-ph="f${n}"]`, fl).getBoundingClientRect(); const cb = q(`.pw[data-ph="f${n}"]`, fl).closest('.col').getBoundingClientRect().bottom - fb.top; return { l: r.left - fb.left + fl.scrollLeft, r: r.right - fb.left + fl.scrollLeft, t: r.top - fb.top, b: cb, w: r.width }; };
  let paths = '<defs><marker id="ahd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--pri)"/></marker></defs>', labs = '';
  EDGES.forEach((e, i) => {
    const a = box(e.f), b = box(e.t); let d, lx, ly;
    if (!e.back) { const x1 = a.l + a.w * .72, x2 = b.l + b.w * .28, y = a.t - 6, h = 64; d = `M${x1},${y} C${x1},${y - h} ${x2},${y - h} ${x2},${y}`; lx = (x1 + x2) / 2; ly = y - h * .75; }
    else { const x1 = a.l + a.w * .3, x2 = b.l + b.w * .7, y = a.b + 8, h = 44; d = `M${x1},${y} C${x1},${y + h} ${x2},${y + h} ${x2},${y}`; lx = (x1 + x2) / 2; ly = y + h * .75; }
    paths += `<g class="edge ${e.back ? 'back' : ''}" data-e="${i}"><path class="base" d="${d}" marker-end="url(#ahd)"/><path class="pulse" d="${d}"/></g>`;
    labs += `<div class="elab" data-e="${i}" style="left:${lx}px;top:${ly}px"><em>${e.f}→${e.t}</em>${e.l}</div>`;
  });
  svg.innerHTML = paths; q('#elabs').innerHTML = labs;
}

/* ---------- interactions (one delegated handler for every phone) ---------- */
document.addEventListener('click', e => {
  const pw = e.target.closest('.pw'); if (!pw) return; const t = e.target;
  const g = t.closest('[data-go]'); if (g) return go(pw, +g.dataset.go);
  const v = t.closest('[data-val]');
  if (v) {
    const n = v.dataset.val;
    if (ST.mine.has(n)) ST.mine.delete(n); else if (ST.mine.size >= 5) { v.classList.remove('shake'); void v.offsetWidth; v.classList.add('shake'); return toast(pw, 'Up to 5 — unpick one first'); } else ST.mine.add(n);
    v.classList.toggle('on', ST.mine.has(n)); q('.cnt', pw).textContent = `${ST.mine.size}/5`;
    qa('.pw[data-kind="discover"]').forEach(renderDeck); return;
  }
  const lk = t.closest('[data-look]'); if (lk) { ST.look = +lk.dataset.look; qa('[data-look]', pw).forEach(b => b.classList.toggle('on', b === lk)); return; }
  const a = t.closest('[data-a]');
  if (a) { a.classList.remove('bump'); void a.offsetWidth; a.classList.add('bump'); const c = q('.card.top', pw); if (c) fling(pw, c, a.dataset.a); return; }
  const ven = t.closest('[data-ven]'); if (ven) { chatOf(pw.dataset.ph).venue = ven.dataset.ven; q('.inv', pw).innerHTML = inviteHTML(pw.dataset.ph); return; }
  if (t.closest('[data-cycle]')) { const c = chatOf(pw.dataset.ph); if (c.state !== 'draft') { c.state = 'draft'; } const ks = Object.keys(VENUES); c.venue = ks[(ks.indexOf(c.venue) + 1) % ks.length]; q('.inv', pw).innerHTML = inviteHTML(pw.dataset.ph); q('.msgs', pw).scrollTop = 9999; return; }
  if (t.closest('[data-invite]')) {
    const id = pw.dataset.ph, c = chatOf(id); c.state = 'wait'; q('.inv', pw).innerHTML = inviteHTML(id);
    setTimeout(() => { c.state = 'yes'; const inv = q('.inv', pw); if (inv) inv.innerHTML = inviteHTML(id); toast(pw, 'It’s a date 🎉'); }, 1500); return;
  }
  if (t.closest('.send')) sendMsg(pw);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.comp input')) sendMsg(e.target.closest('.pw')); });
function sendMsg(pw) {
  const inp = q('.comp input', pw), txt = inp.value.trim() || 'Can’t wait. I’ll be the one with the tote bag 😄', c = chatOf(pw.dataset.ph), m = q('.msgs', pw);
  inp.value = ''; c.extra.push({ me: true, t: txt });
  m.insertAdjacentHTML('beforeend', `<div class="msg me">${esc(txt)}</div><div class="typing"><i></i><i></i><i></i></div>`); m.scrollTop = m.scrollHeight;
  setTimeout(() => { const ty = q('.typing', m); if (ty) ty.remove(); const r = 'Haha perfect. See you Saturday ☀️'; c.extra.push({ me: false, t: r }); m.insertAdjacentHTML('beforeend', `<div class="msg them">${r}</div>`); m.scrollTop = m.scrollHeight; }, 1400);
}

/* ---------- confetti (petals in the preset's reds) ---------- */
function confetti(cv) {
  const ctx = cv.getContext('2d'), Wc = cv.width, Hc = cv.height, cs = getComputedStyle(cv);
  const cols = [cs.getPropertyValue('--sun1'), '#ffffff', cs.getPropertyValue('--blush'), '#FFD166'].map(c => c.trim() || '#fff');
  const parts = Array.from({ length: 110 }, (_, i) => ({ x: Wc / 2 + (Math.random() - .5) * 240, y: Hc * .36, vx: (Math.random() - .5) * 24, vy: -Math.random() * 28 - 8, r: 8 + Math.random() * 10, c: cols[i % 4], rot: Math.random() * 6, vr: (Math.random() - .5) * .3, s: i % 3 }));
  const t0 = performance.now();
  const frame = now => {
    ctx.clearRect(0, 0, Wc, Hc);
    parts.forEach(p => { p.vy += .65; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - (now - t0) / 3200);
      if (p.s === 0) { ctx.beginPath(); ctx.ellipse(0, 0, p.r / 2, p.r / 4.5, 0, 0, 7); ctx.fill(); } else if (p.s === 1) { ctx.beginPath(); ctx.arc(0, 0, p.r / 3, 0, 7); ctx.fill(); } else ctx.fillRect(-p.r / 2, -p.r / 6, p.r, p.r / 3);
      ctx.restore(); });
    if (now - t0 < 3300) requestAnimationFrame(frame); else ctx.clearRect(0, 0, Wc, Hc);
  };
  requestAnimationFrame(frame);
}

/* ---------- views, presets, handoff ---------- */
const app = q('#app');
function buildFlow() {
  q('#frow').innerHTML = FLOW.map(([id, kind, n, sub], i) => `<div class="col">${phone(id, kind)}<div class="cap"><b>${i + 1}</b><div>${n}<small>${sub}</small></div></div></div>`).join('');
  mount(q('#frow')); requestAnimationFrame(drawArcs);
}
function buildCmp() {
  q('#cgrid').innerHTML = Object.entries(PRE).map(([k, p]) => `<div class="pc ${k === ST.p ? 'on' : ''}" data-p="${k}">
    <div class="pc-h"><span class="k">${p.k}</span><div>${p.n}<small>${k === 'd1' ? 'Recommended default' : k === 'd2' ? 'Brighter, high-energy' : 'Earthy, editorial'}</small></div>${k === 'd1' ? '<span class="rec">Recommended</span>' : ''}</div>
    <div class="pc-ph">${phone('c' + k + 'w', 'welcome')}${phone('c' + k + 'd', 'discover')}</div>
    <div class="sw">${p.sw.map(([c, n]) => `<span title="${n}"><i style="background:${c}"></i>${c}</span>`).join('')}</div>
    <p>${p.d}</p><button class="use" data-use="${k}">${k === ST.p ? `✓ Using ${p.k}` : `Use ${p.k}`}</button></div>`).join('');
  mount(q('#cgrid'));
}
function setPreset(k) {
  ST.p = k; app.dataset.p = k; save();
  qa('#pre button').forEach(b => b.classList.toggle('on', b.dataset.p === k));
  qa('#frow .pw').forEach(pw => paint(pw));
  qa('.pc').forEach(c => { const on = c.dataset.p === k; c.classList.toggle('on', on); q('.use', c).textContent = on ? `✓ Using ${PRE[c.dataset.p].k}` : `Use ${PRE[c.dataset.p].k}`; });
  renderHand();
}
function setView(v) {
  ST.view = v; app.classList.toggle('v-flow', v === 'flow'); app.classList.toggle('v-cmp', v === 'cmp'); save();
  qa('#vw button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'cmp' && !q('#cgrid .pw')) buildCmp();
  if (v === 'flow') requestAnimationFrame(drawArcs);
}
q('#pre').innerHTML = Object.entries(PRE).map(([k, p]) => `<button data-p="${k}"><span class="dots">${p.sw.slice(2, 5).map(([c]) => `<i style="background:${c}"></i>`).join('')}</span>${p.k} · ${p.n.split(' & ')[0]}${k === 'd1' ? ' <span class="rec">Rec.</span>' : ''}</button>`).join('');
qa('#pre button').forEach(b => b.onclick = () => setPreset(b.dataset.p));
qa('#vw button').forEach(b => b.onclick = () => setView(b.dataset.v));
q('#cgrid').addEventListener('click', e => { const u = e.target.closest('[data-use]'); if (u) setPreset(u.dataset.use); });

const promptFor = k => { const p = PRE[k]; return `Apply refined Option D · ${p.k} "${p.n}" to Comradia. Palette: ${p.sw.map(([c, n]) => `${n} ${c}`).join(', ')}. Keep Option D geometry: arch-topped portraits, Outfit rounded sans, DM Mono distance tags (03 KM · PINHEIROS), sun and topographic line motifs, airy 34px cards. Use everyday dating copy: "Meet someone who gives a damn.", Find Your Person, Discover / Nearby, Conversation Starter, Send a Note, LIKE / PASS stamps, It's a Match!, Suggest a First Date Spot; Values & Passions chips instead of political tendencies and union locals. Roll out to all 11 screens of the flow chart.`; };
function renderHand() {
  const p = PRE[ST.p];
  q('#hT').innerHTML = `Using ${p.k} · ${p.n}<small>Copy this and send it to me to apply it everywhere</small>`;
  q('#hChip').textContent = promptFor(ST.p); q('#hCopy').textContent = `Copy “Apply ${p.k}”`;
}
q('#hCopy').onclick = async () => {
  const b = q('#hCopy');
  try { await navigator.clipboard.writeText(promptFor(ST.p)); b.textContent = 'Copied ✓'; }
  catch (_) { const r = document.createRange(); r.selectNodeContents(q('#hChip')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Selected — press ⌘C'; }
  setTimeout(renderHand, 1800);
};
new ResizeObserver(() => ST.view === 'flow' && drawArcs()).observe(q('#flow'));
q('#flow').addEventListener('scroll', drawArcs, { passive: true });

app.dataset.p = ST.p; buildFlow(); setPreset(ST.p); setView(ST.view);
window.__d = { ST, go, setPreset, setView, DECK, CHAT };
})();
</script>
